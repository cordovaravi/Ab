name: worldos_browser
description: WorldOS Browser V1 — Intent Workspace + Real Action Browser
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # LLM inference — https://llamadart.leehack.com/
  llama_cpp_dart: ^0.0.9

  # Networking
  http: ^1.2.1
  html: ^0.15.4
  dio: ^5.4.0

  # State & storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # UI
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  uuid: ^4.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.2
  webview_flutter: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
